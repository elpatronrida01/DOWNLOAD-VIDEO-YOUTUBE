<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ClipVory - All-in-One Video Downloader</title>
    <meta name="description" content="ClipVory - Fast, modern, and secure multi-platform video downloader supporting YouTube, Instagram, TikTok, Twitter/X, Vimeo, Reddit, Pinterest, and Dailymotion with quality options and instant previews." />
    <meta property="og:title" content="ClipVory - All-in-One Video Downloader" />
    <meta property="og:description" content="ClipVory - Fast, modern, and secure multi-platform video downloader supporting YouTube, Instagram, TikTok, Twitter/X, Vimeo, Reddit, Pinterest, and Dailymotion with quality options and instant previews." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Website Favicons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#4338CA" />
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('clipvory_theme');
          var isDark = saved ? saved === 'dark' : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
